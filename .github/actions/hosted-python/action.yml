# Prepare a GitHub-hosted ubuntu-24.04 runner to run the Python suite like the Home Server.
name: Hosted Python environment
description: Native tools, layout alignment, locked dependencies and pinned Ruff for the Local Assistant test suite.
runs:
  using: composite
  steps:
    - name: Free runner disk
      # Check-runtime tests copy the Python stdlib into per-test capsules.
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h / | tail -1

    - name: Restore cached apt packages
      id: apt-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/apt-debs
        key: apt-ubuntu-24.04-${{ hashFiles('.github/actions/hosted-python/action.yml') }}
        restore-keys: apt-ubuntu-24.04-

    - name: Install native tools
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        PACKAGES: >-
          bubblewrap ffmpeg tesseract-ocr tesseract-ocr-eng poppler-utils
          libreoffice-core libreoffice-writer libreoffice-calc
      run: |
        # Package downloads from the runner's Azure mirror sometimes stall for minutes.
        # Reuse cached .deb files, bound every apt call, and fall back to
        # archive.ubuntu.com before retrying.
        if compgen -G "$HOME/apt-debs/*.deb" >/dev/null; then
          sudo cp "$HOME"/apt-debs/*.deb /var/cache/apt/archives/
        fi
        use_archive_mirror() {
          echo "::warning::switching apt to archive.ubuntu.com"
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] && sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' "$f"
          done
        }
        apt_opts="-q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 -o APT::Keep-Downloaded-Packages=true"
        ok=
        for attempt in 1 2 3; do
          if timeout 240 sudo -E apt-get $apt_opts update &&
             timeout 480 sudo -E apt-get $apt_opts install -y --no-install-recommends $PACKAGES; then
            ok=1; break
          fi
          echo "::warning::apt attempt $attempt failed or timed out"
          [ "$attempt" = 1 ] && use_archive_mirror
          sleep 10
        done
        [ -n "$ok" ]
        mkdir -p "$HOME/apt-debs"
        cp /var/cache/apt/archives/*.deb "$HOME/apt-debs/" 2>/dev/null || true
        du -sh "$HOME/apt-debs"

    - name: Save apt packages for later runs
      if: steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/apt-debs
        key: apt-ubuntu-24.04-${{ hashFiles('.github/actions/hosted-python/action.yml') }}

    - name: Align the runner layout with the Home Server
      shell: bash
      run: |
        # Workers use unprivileged user namespaces through bwrap.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        # The check-runtime capsule copies /usr/lib/python3.12 and rejects symlinks and
        # files over 4 MiB. The runner's libpython3.12-dev adds config-3.12-x86_64-linux-gnu
        # (static libpython archives, .so symlink), absent on the Home Server.
        sudo mv /usr/lib/python3.12/config-3.12-x86_64-linux-gnu /opt/python3.12-config-moved
        # Media workers bind only /usr. Ubuntu 24.04's ffmpeg 6.1 loads libblas/liblapack
        # through /etc/alternatives symlinks, unreachable inside that sandbox.
        for lib in $(ldd /usr/bin/ffmpeg /usr/bin/ffprobe | awk '/=>/ {print $3}' | sort -u); do
          if [ -L "$lib" ] && [[ "$(readlink "$lib")" == /etc/* ]]; then
            echo "repoint $lib -> $(readlink -f "$lib")"
            sudo ln -sfn "$(readlink -f "$lib")" "$lib"
          fi
        done
        git config --global user.name "CI"
        git config --global user.email "ci@localhost"

    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.9.13"

    - name: Install locked dependencies on Ubuntu system CPython 3.12
      # uv's standalone CPython lacks fcntl.F_SEAL_*, required by check_seccomp.py.
      # Pinned-Ruff tests look for the binary under ~/.cache/uv, as on the Home Server;
      # set per step because setup-uv exports its own UV_CACHE_DIR.
      shell: bash
      env:
        UV_CACHE_DIR: /home/runner/.cache/uv
        UV_PYTHON_PREFERENCE: only-system
      run: |
        uv sync --locked --dev --python /usr/bin/python3.12
        uv tool run "ruff@0.17.1" --version
