# Continuous integration and packaging for Local Assistant on GitHub-hosted runners.
#
# Hosted runners have no GPU, models, PostgreSQL, Vault, Qdrant or private data/.
# Tests that need them are listed with reasons in .github/ci/hosted-runner-exclusions.txt;
# tests gated on DATABASE_URL or explicit evaluation flags skip themselves.
# Nothing in this workflow contacts or deploys to the Home Server.
name: CI

on:
  pull_request:
  push:
    branches: [develop, staging, production]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.9.13"
  RUFF_VERSION: "0.17.1"
  NODE_VERSION: "24"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      python_files: ${{ steps.changed.outputs.python_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        name: List changed Python files
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          files="$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.py' | tr '\n' ' ')"
          echo "Changed Python files: $(echo $files | wc -w)"
          echo "python_files=$files" >> "$GITHUB_OUTPUT"

  lint:
    needs: prepare
    if: needs.prepare.outputs.python_files != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Ruff check (changed files)
        run: uv tool run "ruff@${RUFF_VERSION}" check --isolated --select E4,E7,E9,F ${{ needs.prepare.outputs.python_files }}
      - name: Ruff format check (changed files)
        run: uv tool run "ruff@${RUFF_VERSION}" format --check ${{ needs.prepare.outputs.python_files }}

  test-python:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        # Check-runtime tests copy the Python stdlib into per-test capsules.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Align native tools with the Home Server layout
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # apt occasionally stalls silently on hosted runners; bound and retry each call.
          retry() {
            local limit=$1; shift
            for attempt in 1 2 3; do
              timeout "$limit" "$@" && return 0
              echo "::warning::attempt $attempt failed or timed out: $*"; sleep 10
            done
            return 1
          }
          apt_opts="-q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          retry 240 sudo -E apt-get $apt_opts update
          retry 480 sudo -E apt-get $apt_opts install -y --no-install-recommends \
            bubblewrap ffmpeg tesseract-ocr tesseract-ocr-eng poppler-utils \
            libreoffice-core libreoffice-writer libreoffice-calc
          # Workers use unprivileged user namespaces through bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # The check-runtime capsule copies /usr/lib/python3.12 and rejects symlinks and
          # files over 4 MiB. The runner's libpython3.12-dev adds config-3.12-x86_64-linux-gnu
          # (static libpython archives, .so symlink), absent on the Home Server.
          sudo mv /usr/lib/python3.12/config-3.12-x86_64-linux-gnu /opt/python3.12-config-moved
          # Media workers bind only /usr. Ubuntu 24.04's ffmpeg 6.1 loads libblas/liblapack
          # through /etc/alternatives symlinks, unreachable inside that sandbox.
          for lib in $(ldd /usr/bin/ffmpeg /usr/bin/ffprobe | awk '/=>/ {print $3}' | sort -u); do
            if [ -L "$lib" ] && [[ "$(readlink "$lib")" == /etc/* ]]; then
              echo "repoint $lib -> $(readlink -f "$lib")"
              sudo ln -sfn "$(readlink -f "$lib")" "$lib"
            fi
          done
          git config --global user.name "CI"
          git config --global user.email "ci@localhost"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked dependencies on Ubuntu system CPython 3.12
        # uv's standalone CPython lacks fcntl.F_SEAL_*, required by check_seccomp.py.
        # Pinned-Ruff tests look for the binary under ~/.cache/uv, as on the Home Server;
        # set per step because setup-uv exports its own UV_CACHE_DIR.
        env:
          UV_CACHE_DIR: /home/runner/.cache/uv
        run: |
          uv sync --locked --dev --python /usr/bin/python3.12
          uv tool run "ruff@${RUFF_VERSION}" --version
      - name: Pytest (hosted-runner scope)
        env:
          PYTHONPATH: .github/ci
          UV_CACHE_DIR: /home/runner/.cache/uv
        run: |
          # Older revisions have no benchmarks/tests; pass only directories that exist.
          dirs=()
          for d in tests benchmarks/tests; do [ -d "$d" ] && dirs+=("$d"); done
          uv run --no-sync python -m pytest "${dirs[@]}" \
            -p hosted_exclusions -p no:cacheprovider -q -rfE \
            -o tmp_path_retention_policy=failed \
            --junitxml=pytest-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-junit
          path: pytest-junit.xml
          retention-days: 14

  test-js:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: node --test
        run: |
          shopt -s nullglob
          files=(tests/test_*.mjs)
          if [ ${#files[@]} -eq 0 ]; then echo "No JavaScript tests in this revision."; exit 0; fi
          node --test "${files[@]}"

  ci-gate:
    if: always()
    needs: [prepare, lint, test-python, test-js]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::CI gate failed ($result)"; exit 1 ;;
            esac
          done

  package:
    needs: ci-gate
    # !cancelled(): a skipped upstream job (e.g. lint with no .py changes) must not skip packaging.
    if: >-
      ${{ !cancelled() && needs.ci-gate.result == 'success' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.bundle.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: bundle
        name: Build source bundle from tracked files
        run: |
          name="local-assistant-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          mkdir dist
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" HEAD
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS)
          cat dist/SHA256SUMS
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: dist/
          retention-days: 30

  deploy-staging:
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' && github.ref == 'refs/heads/staging' }}
    runs-on: ubuntu-24.04
    environment:
      name: staging
    steps:
      - name: Record staging deployment
        run: |
          {
            echo "### Staging deployment"
            echo "- Bundle: \`${{ needs.package.outputs.name }}\` (workflow artifact)"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Scope: packaged build only; nothing is deployed to the Home Server."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.name }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
