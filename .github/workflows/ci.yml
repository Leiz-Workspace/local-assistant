# Continuous integration and packaging for Local Assistant.
#
# Every job runs on the runner chosen by the repository variable CI_RUNS_ON (a JSON value
# for runs-on). Unset, jobs use the GitHub-hosted ubuntu-24.04 image. Set to
# ["self-hosted","aevra-home"], they use the self-hosted runner on the Home Server
# (self-software-distribution-platform repository github-runner/, ADR-194/196).
#
# GitHub-hosted runners have no GPU, models, PostgreSQL, Vault, Qdrant or private data/.
# The self-hosted runner is a hardened systemd service under an unprivileged user: /home (owner
# files, Vault bootstrap, models, .env, data/) is hidden, and the unit refuses the GPU devices and
# direct connections to the LAN, Docker and k3s networks. Jobs there can still connect to services
# listening on loopback (Vault, Qdrant, PostgreSQL, Redis, MongoDB, sshd, k3s, CORE when running)
# and rely on those services' own authentication. Redis on 127.0.0.1:6379 accepts every command
# without authentication (both MongoDB instances require it), and sshd on 127.0.0.1:22 accepts
# password guesses for other accounts; those residual risks are the owner's decision (ADR-194).
# The unit's network filter covers only its own sockets; it also hides tailscaled's LocalAPI
# socket, which would otherwise reach tailnet peers, and the preflight checks both. sshd denies SSH logins as the runner user, so a key
# that a job plants in its ~/.ssh forwards nothing (ADR-194). Jobs there can also
# read the command line of every host process, so no secret may be passed as an argument on the host.
# Tests that need those services are listed with reasons in .github/ci/hosted-runner-exclusions.txt;
# tests gated on DATABASE_URL or explicit evaluation flags skip themselves. The exclusions only
# select tests; they do not isolate anything.
# Nothing in this workflow contacts or deploys to the Home Server's services.
# Remote actions are pinned to full commit SHAs (version in the comment): on the self-hosted
# runner their code runs on the Home Server.
name: CI

on:
  pull_request:
  push:
    branches: [develop, staging, production]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.9.13"
  RUFF_VERSION: "0.17.1"
  NODE_VERSION: "24"

jobs:
  prepare:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    outputs:
      python_files: ${{ steps.changed.outputs.python_files }}
      run_tests: ${{ steps.changed.outputs.run_tests }}
      quarantine: ${{ steps.changed.outputs.quarantine }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
      - id: changed
        name: List changed files
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # The quarantine job runs only while its list has an entry.
          if grep -Eqv '^[[:space:]]*(#|$)' .github/ci/hosted-runner-quarantine.txt 2>/dev/null; then
            echo "quarantine=true" >> "$GITHUB_OUTPUT"
          else
            echo "quarantine=false" >> "$GITHUB_OUTPUT"
          fi
          # Lint guards changes entering develop. Promotions to staging/production carry
          # code already linted there; linting their whole diff would only re-report the
          # pre-existing debt in hash-protected historical files. Promotions, tags and manual
          # runs always run every test job.
          if [[ "$EVENT" == "pull_request" && "$BASE_REF" =~ ^(staging|production)$ ]] ||
             [[ "$EVENT" == "push" && "$REF" =~ ^refs/(heads/(staging|production)|tags/) ]]; then
            echo "Promotion ($EVENT ${BASE_REF:-$REF}): lint is enforced on changes into develop."
            echo "python_files=" >> "$GITHUB_OUTPUT"
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          files="$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.py' | tr '\n' ' ')"
          echo "Changed Python files: $(echo $files | wc -w)"
          echo "python_files=$files" >> "$GITHUB_OUTPUT"
          # A pull request skips the test jobs only when every changed path is documentation that
          # nothing reads: dev_log/, or docs/ outside docs/evidence/ and docs/proposals/ (tests and the
          # voice trial read those) whose exact path appears in no non-Markdown file of tests,
          # benchmarks, src, apps, scripts, configs or .github. A rename lists its old and new paths,
          # so moving a file out of code into docs/ runs every test. Every push (develop after a
          # merge, where an earlier run may have been cancelled) and every manual run tests all.
          run_tests=false
          [ "$EVENT" = pull_request ] || run_tests=true
          changed="$(git diff --no-renames --name-only "$base" HEAD)"
          [ -n "$changed" ] || run_tests=true
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              dev_log/*) ;;
              docs/evidence/*|docs/proposals/*) run_tests=true ;;
              docs/*)
                if git grep -qF -- "$path" -- tests benchmarks src apps scripts configs .github ':(exclude)*.md'; then
                  run_tests=true
                fi ;;
              *) run_tests=true ;;
            esac
          done <<<"$changed"
          echo "Run test jobs: $run_tests"
          echo "run_tests=$run_tests" >> "$GITHUB_OUTPUT"

  lint:
    needs: prepare
    if: needs.prepare.outputs.python_files != ''
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Ruff check (changed files)
        run: uv tool run "ruff@${RUFF_VERSION}" check --isolated --select E4,E7,E9,F ${{ needs.prepare.outputs.python_files }}
      - name: Ruff format check (changed files)
        run: uv tool run "ruff@${RUFF_VERSION}" format --check ${{ needs.prepare.outputs.python_files }}

  test-python:
    needs: prepare
    if: needs.prepare.outputs.run_tests == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 45
    env:
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      # Tests in this scope run node. The self-hosted runner has no system node, and the
      # composite action's self-hosted preflight checks for it, so this step comes first.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/hosted-python
      - name: Pytest (hosted-runner scope, main)
        env:
          PYTHONPATH: .github/ci
          HOSTED_TEST_MODE: main
          # pytest-xdist needs every worker to collect the same parametrized ids; some ids come
          # from set iteration, so the hash seed is fixed.
          PYTHONHASHSEED: "0"
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          # Pinned-Ruff tests look for the binary under ~/.cache/uv, as on the Home Server.
          export UV_CACHE_DIR="$HOME/.cache/uv"
          # Older revisions have no benchmarks/tests; pass only directories that exist.
          dirs=()
          for d in tests benchmarks/tests; do [ -d "$d" ] && dirs+=("$d"); done
          # Parallel workers when the revision has pytest-xdist: 6 on the Home Server (a runner
          # instance may use 8 CPUs), 2 on a GitHub-hosted runner. Whole files stay on one worker
          # (--dist loadfile), so module fixtures are built once.
          parallel=()
          if uv run --no-sync python -c 'import xdist' 2>/dev/null; then
            workers=6; [ "$RUNNER_KIND" = github-hosted ] && workers=2
            parallel=(-n "$workers" --dist loadfile)
          fi
          # A short base directory keeps AF_UNIX socket paths in tmp_path under 108 bytes.
          basetemp="${TMPDIR:-${RUNNER_TEMP:-/tmp}}/pt"
          uv run --no-sync python -m pytest "${dirs[@]}" "${parallel[@]}" \
            -p hosted_exclusions -p no:cacheprovider -q -rfE \
            -o tmp_path_retention_policy=failed --basetemp="$basetemp" \
            --junitxml=pytest-junit.xml
      # Nothing reads the JUnit file of a passing run, so it is kept only for a failed or
      # cancelled one.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: failure() || cancelled()
        with:
          name: pytest-junit-main
          path: pytest-junit.xml
          retention-days: 7

  test-python-quarantine:
    needs: prepare
    if: needs.prepare.outputs.run_tests == 'true' && needs.prepare.outputs.quarantine == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 45
    # Known-intermittent tests (see .github/ci/hosted-runner-quarantine.txt) still run and
    # report here, but do not block ci-gate until their root cause is fixed.
    continue-on-error: true
    env:
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      # Same as test-python: node before the composite action and its preflight.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/hosted-python
      - name: Pytest (hosted-runner scope, quarantine)
        env:
          PYTHONPATH: .github/ci
          HOSTED_TEST_MODE: quarantine
        run: |
          # Pinned-Ruff tests look for the binary under ~/.cache/uv, as on the Home Server.
          export UV_CACHE_DIR="$HOME/.cache/uv"
          # Older revisions have no benchmarks/tests; pass only directories that exist.
          dirs=()
          for d in tests benchmarks/tests; do [ -d "$d" ] && dirs+=("$d"); done
          status=0
          uv run --no-sync python -m pytest "${dirs[@]}" \
            -p hosted_exclusions -p no:cacheprovider -q -rfE \
            -o tmp_path_retention_policy=failed \
            --junitxml=pytest-junit.xml || status=$?
          # Exit 5 means no test was selected. Accept it only when the list has no entries,
          # so a stale or mistyped entry still fails this job.
          if [ "$status" -eq 5 ] && ! grep -Eqv '^[[:space:]]*(#|$)' .github/ci/hosted-runner-quarantine.txt; then
            echo "No quarantined tests selected."
            exit 0
          fi
          exit "$status"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: failure() || cancelled()
        with:
          name: pytest-junit-quarantine
          path: pytest-junit.xml
          retention-days: 7

  test-js:
    needs: prepare
    if: needs.prepare.outputs.run_tests == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: node --test
        run: |
          shopt -s nullglob
          files=(tests/test_*.mjs)
          if [ ${#files[@]} -eq 0 ]; then echo "No JavaScript tests in this revision."; exit 0; fi
          node --test "${files[@]}"

  ci-gate:
    if: always()
    needs: [prepare, lint, test-python, test-js]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - name: Require every job to succeed or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::CI gate failed ($result)"; exit 1 ;;
            esac
          done

  package:
    needs: ci-gate
    # !cancelled(): a skipped upstream job (e.g. lint with no .py changes) must not skip packaging.
    if: >-
      ${{ !cancelled() && needs.ci-gate.result == 'success' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    outputs:
      name: ${{ steps.bundle.outputs.name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - id: bundle
        name: Build source bundle from tracked files
        run: |
          name="local-assistant-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          mkdir dist
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" HEAD
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            uv sync --locked --no-dev
            uv run --no-sync aevra ui prepare
            packaging/deb/build-deb.sh "${GITHUB_REF_NAME#v}" dist
            cp packaging/cli/install.sh "dist/install-aevra-${GITHUB_REF_NAME}.sh"
            chmod 0755 "dist/install-aevra-${GITHUB_REF_NAME}.sh"
          fi
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: dist/
          # Reproducible from the tagged commit with git archive; the release job copies it.
          retention-days: 14

  deploy-staging:
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' && github.ref == 'refs/heads/staging' }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    environment:
      name: staging
    steps:
      - name: Record staging deployment
        run: |
          {
            echo "### Staging deployment"
            echo "- Bundle: \`${{ needs.package.outputs.name }}\` (workflow artifact)"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Scope: packaged build only; nothing is deployed to the Home Server."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: ${{ needs.package.outputs.name }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # A hyphenated tag (v0.1.0-alpha.1) is a pre-release, as in .forgejo/workflows/forgejo-release.yml.
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes --verify-tag "${prerelease[@]}"
