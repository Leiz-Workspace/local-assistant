<!doctype html>
<!-- Provide explicit local microphone controls with ephemeral playback and no audio submission. -->
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Assistant — Ghi âm chủ động</title>
<style>body{max-width:48rem;margin:3rem auto;padding:0 1rem;font:18px/1.6 system-ui}button{padding:.7rem 1.2rem;margin:.3rem;font:inherit}audio{display:block;width:100%;margin-top:1rem}#status{font-weight:600}button:focus-visible{outline:3px solid #184cce}</style>
<script type="module" src="/page.mjs"></script></head>
<body><h1>Ghi âm chủ động</h1>
<p>Chỉ ghi khi bạn bấm Bắt đầu và cho phép microphone. Tối đa 30 giây. Audio chỉ ở trong bộ nhớ trang này; chưa gửi đi hoặc chạy nhận dạng giọng nói.</p>
<p id="status" role="status" aria-live="polite">Chưa ghi âm</p>
<button id="start" type="button">Bắt đầu ghi</button>
<button id="stop" type="button" disabled>Dừng và nghe lại</button>
<button id="cancel" type="button" disabled>Hủy / xóa audio</button>
<p>Nhấn Escape hoặc chuyển khỏi trang sẽ hủy ghi âm. Muốn ghi lại, bạn cần bấm Bắt đầu lần nữa.</p>
<audio id="preview" controls preload="none" hidden></audio>
</body></html>
