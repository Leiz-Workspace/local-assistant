# Define application dependencies and uv/pytest execution settings.
[project]
name = "ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "defusedxml>=0.7,<1",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=6,<7",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.54.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
